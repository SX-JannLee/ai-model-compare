name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sx-jannlee.github.io
          NEXT_PUBLIC_BASE_PATH: /ai-model-compare

      - name: Verify SEO artifacts
        run: |
          test -f out/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/feed.xml
          test -f out/404.html
          test -d out/models/claude-fable-5-2